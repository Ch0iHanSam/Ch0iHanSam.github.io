<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사진 세로 병합 PDF 메이커</title>
    <!-- PDF 생성을 위한 jsPDF 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #333;
        }
        .btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .btn:hover { background-color: #0056b3; }
        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .btn-download {
            background-color: #34c759;
        }
        .btn-download:hover { background-color: #248a3d; }
        
        /* 캐러셀(미리보기) 스타일 */
        .carousel-container {
            display: none; /* 초기에는 숨김 */
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
            background: #000;
            border-radius: 8px;
            padding: 10px;
            position: relative;
        }
        .carousel-btn {
            background: rgba(255,255,255,0.3);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel-btn:hover { background: rgba(255,255,255,0.6); }
        .preview-img {
            width: 200px;
            height: 355px; /* 9:16 비율에 맞춘 미리보기 크기 */
            object-fit: cover;
            border-radius: 4px;
        }
        .page-indicator {
            color: white;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📸 사진 세로 병합 (9:16)</h1>
    
    <!-- 사진 첨부 버튼 -->
    <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
    <button class="btn" onclick="document.getElementById('fileInput').click()">사진 여러 장 첨부하기</button>

    <!-- 미리보기 영역 -->
    <div class="carousel-container" id="carousel">
        <button class="carousel-btn" onclick="prevImage()">❮</button>
        <img id="previewImg" class="preview-img" src="" alt="미리보기">
        <div class="page-indicator" id="pageIndicator">1 / 1</div>
        <button class="carousel-btn" onclick="nextImage()">❯</button>
    </div>

    <!-- 다운로드 버튼 -->
    <button class="btn btn-download" id="downloadBtn" onclick="generatePDF()" disabled>PDF 다운로드</button>
</div>

<script>
    let processedImages = []; // 9:16으로 변환된 이미지 데이터 배열
    let currentIndex = 0;

    const fileInput = document.getElementById('fileInput');
    const carousel = document.getElementById('carousel');
    const previewImg = document.getElementById('previewImg');
    const pageIndicator = document.getElementById('pageIndicator');
    const downloadBtn = document.getElementById('downloadBtn');

    // 사진 파일 선택 시 처리
    fileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        processedImages = [];
        currentIndex = 0;
        downloadBtn.disabled = true;
        downloadBtn.innerText = "처리 중...";

        // 선택된 모든 파일을 9:16으로 변환
        for (let file of files) {
            const dataUrl = await processImageTo9x16(file);
            processedImages.push(dataUrl);
        }

        // UI 업데이트
        updateCarousel();
        carousel.style.display = 'flex';
        downloadBtn.disabled = false;
        downloadBtn.innerText = "PDF 다운로드";
    });

    // 이미지를 9:16 비율로 자르고 변환하는 함수
    function processImageTo9x16(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    // 병합 시 화질을 위해 고정 해상도 사용 (가로 900, 세로 1600)
                    canvas.width = 900;
                    canvas.height = 1600;
                    const ctx = canvas.getContext('2d');

                    const imgRatio = img.width / img.height;
                    const targetRatio = 9 / 16;
                    let sx, sy, sWidth, sHeight;

                    // 비율에 맞춰 크롭(자르기) 영역 계산 (object-fit: cover 방식)
                    if (imgRatio > targetRatio) {
                        sHeight = img.height;
                        sWidth = sHeight * targetRatio;
                        sx = (img.width - sWidth) / 2;
                        sy = 0;
                    } else {
                        sWidth = img.width;
                        sHeight = sWidth / targetRatio;
                        sx = 0;
                        sy = (img.height - sHeight) / 2;
                    }

                    // 투명 배경일 경우를 대비해 흰색으로 채우기
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // 캔버스에 이미지 그리기
                    ctx.drawImage(img, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);
                    
                    resolve(canvas.toDataURL('image/jpeg', 0.9));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    // 좌우 넘기기 함수
    function prevImage() {
        if (currentIndex > 0) {
            currentIndex--;
            updateCarousel();
        }
    }

    function nextImage() {
        if (currentIndex < processedImages.length - 1) {
            currentIndex++;
            updateCarousel();
        }
    }

    // 캐러셀 UI 갱신
    function updateCarousel() {
        if (processedImages.length > 0) {
            previewImg.src = processedImages[currentIndex];
            pageIndicator.innerText = `${currentIndex + 1} / ${processedImages.length}`;
        }
    }

    // PDF 생성 및 다운로드 함수
    function generatePDF() {
        if (processedImages.length === 0) return;
        downloadBtn.innerText = "PDF 생성 중...";
        downloadBtn.disabled = true;

        setTimeout(() => {
            const { jsPDF } = window.jspdf;
            
            // 모든 사진을 세로로 이어붙인 전체 높이 계산
            const pageHeight = 1600 * processedImages.length;
            const pageWidth = 900;

            // 세로로 긴 사용자 정의 크기의 PDF 생성
            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'px',
                format: [pageWidth, pageHeight]
            });

            // 각 이미지를 Y좌표를 이동하며 PDF에 추가
            processedImages.forEach((imgData, index) => {
                const yOffset = index * 1600;
                pdf.addImage(imgData, 'JPEG', 0, yOffset, pageWidth, 1600);
            });

            pdf.save('stitched_photos.pdf');
            
            downloadBtn.innerText = "PDF 다운로드";
            downloadBtn.disabled = false;
        }, 100); // UI가 멈추지 않도록 약간의 지연 후 실행
    }
</script>

</body>
</html>
