<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소리새 노래맞추기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #1a1a2e;
            color: white;
            overflow-x: hidden;
        }

        .title-font {
            font-family: 'Black Han Sans', sans-serif;
        }

        .slot-machine-container {
            background: linear-gradient(145deg, #2a2a4a, #151525);
            border: 8px solid #ffd700;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(0,0,0,0.8);
            padding: 20px;
        }

        .slot-window {
            height: 120px;
            overflow: hidden;
            background-color: #ffffff;
            border-radius: 10px;
            border: 4px solid #333;
            box-shadow: inset 0px 10px 15px rgba(0,0,0,0.2), inset 0px -10px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .slot-window::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 10;
        }

        .slot-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .slot-item {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            color: #222;
            text-align: center;
            word-break: keep-all;
            padding: 0 10px;
        }

        @media (max-width: 640px) {
            .slot-window { height: 90px; }
            .slot-item { height: 90px; font-size: 1.1rem; }
            .slot-machine-container { border-width: 4px; padding: 10px; }
        }

        .spin-btn {
            background: linear-gradient(to bottom, #ff416c, #ff4b2b);
            box-shadow: 0 6px 0 #c2293e, 0 10px 20px rgba(0,0,0,0.5);
            transition: all 0.1s;
        }
        .spin-btn:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 0 0 #c2293e, 0 5px 10px rgba(0,0,0,0.5);
        }
        .spin-btn:disabled {
            background: #555;
            box-shadow: 0 6px 0 #333;
            cursor: not-allowed;
            color: #aaa;
        }

        /* LP판 디자인 및 회전 효과 */
        .lp-disc {
            background: radial-gradient(circle, #333 12%, #111 13%, #111 40%, #222 41%, #111 70%);
            position: relative;
        }
        .lp-disc::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 45%;
            height: 3px;
            background-color: rgba(255, 255, 255, 0.95);
            transform-origin: left center;
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin 3s linear infinite;
        }
        .paused-spin {
            animation-play-state: paused;
        }

        /* 오디오 플레이어 버튼 스타일 */
        .btn-active-play {
            background-color: #4f46e5;
            color: white;
            cursor: pointer;
        }
        .btn-inactive {
            background-color: #4b5563;
            color: #d1d5db;
            cursor: not-allowed;
        }
    </style>
</head>

        function getYoutubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url;
        }

        function getRandomItemByWeight(items) {
            const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
            let random = Math.random() * totalWeight;
            
            for (const item of items) {
                if (random < item.weight) return item.text;
                random -= item.weight;
            }
            return items[items.length - 1].text;
        }

        function getRandomText(items) {
            const idx = Math.floor(Math.random() * items.length);
            return items[idx].text;

        async function spinSlot(slotId, dataArr, winnerText, duration, extraSpins) {
            return new Promise((resolve) => {
                const wrapper = document.getElementById(slotId);
                wrapper.innerHTML = '';
                wrapper.style.transition = 'none';
                wrapper.style.transform = 'translateY(0)';

                const itemHeight = window.innerWidth <= 640 ? 90 : 120;
                const totalItems = extraSpins + 1;

                let htmlStr = `<div class="slot-item">${getRandomText(dataArr)}</div>`;
                for(let i = 0; i < extraSpins - 1; i++) {
                    htmlStr += `<div class="slot-item">${getRandomText(dataArr)}</div>`;
                }
                htmlStr += `<div class="slot-item text-red-600">${winnerText}</div>`;
                
                wrapper.innerHTML = htmlStr;
                wrapper.offsetHeight; 

                wrapper.style.transition = `transform ${duration}ms cubic-bezier(0.2, 0.8, 0.1, 1)`;
                wrapper.style.transform = `translateY(-${(totalItems - 1) * itemHeight}px)`;

                setTimeout(() => { resolve(winnerText); }, duration);
            });
        }

        // 퀴즈 화면 개선된 자연스러운 재생 로직
        function playAudioWithLimit() {
            const iframe = document.getElementById('ytPlayer');
            const playBtn = document.getElementById('playAudioBtn');
            const lpRecord = document.getElementById('lpRecord');
            const countdownDisplay = document.getElementById('countdownDisplay');

            // 기존 진행중인 타이머 모두 안전하게 초기화
            clearTimeout(audioTimer); 
            clearTimeout(delayPlayTimer);
            clearInterval(countInterval);

            if (playBtn) {
                playBtn.className = 'px-6 py-2.5 btn-inactive font-bold text-sm md:text-base rounded-xl shadow-md transition';
                playBtn.disabled = true;
            }

            if (iframe && iframe.contentWindow) {
                let T = currentQuizStart;
                let duration = currentQuizDuration;

                // 1. 처음엔 무조건 뮤트
                iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'mute' }), '*');
                
                if (T >= 5) {
                    // 시작 시점이 5초 이상이면, 5초 전으로 탐색하여 뮤트된 상태로 즉시 재생 (버퍼링 및 자연스러운 카운트다운)
                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'seekTo', args: [T - 5, true] }), '*');
                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'playVideo' }), '*');
                } else {
                    // 시작 시점이 5초 미만이면, 0초로 탐색 후 일시정지 상태 대기
                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'seekTo', args: [0, true] }), '*');
                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'pauseVideo' }), '*');
                    
                    // (5 - T)초가 지난 시점부터 영상 재생 시작 (뮤트 상태)
                    delayPlayTimer = setTimeout(() => {
                        iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'playVideo' }), '*');
                    }, (5 - T) * 1000);
                }
                
                // 2. 화면에 5초 카운트다운 표시
                let count = 5;
                countdownDisplay.innerText = count;
                countdownDisplay.classList.remove('hidden');

                countInterval = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownDisplay.innerText = count;
                    } else {
                        // 카운트다운 0 도달 (정확히 시작 지점 T에 영상이 위치함)
                        clearInterval(countInterval);
                        countdownDisplay.classList.add('hidden');

                        if (lpRecord) {
                            lpRecord.classList.remove('paused-spin');
                        }

                        // 뮤트 해제하여 소리 출력
                        iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'unMute' }), '*');

                        // 정해진 시간(1초 또는 3초) 뒤에 멈춤
                        audioTimer = setTimeout(() => {
                            stopAudio();
                        }, duration * 1000);
                    }
                }, 1000);
            }
        }

                iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'mute' }), '*');
                
                if (T >= 5) {
                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'seekTo', args: [T - 5, true] }), '*');
                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'playVideo' }), '*');
                } else {
                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'seekTo', args: [0, true] }), '*');
                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'pauseVideo' }), '*');
                    
                    testDelayPlayTimer = setTimeout(() => {
                        iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'playVideo' }), '*');
                    }, (5 - T) * 1000);
                }
                
                let count = 5;
                testCountdownDisplay.innerText = count;
                testCountdownDisplay.classList.remove('hidden');

                testCountInterval = setInterval(() => {
                    count--;
                    if (count > 0) {
                        testCountdownDisplay.innerText = count;
                    } else {
                        clearInterval(testCountInterval);
                        testCountdownDisplay.classList.add('hidden');

                        if (lpRecord) {
                            lpRecord.classList.remove('paused-spin');
                        }

                        iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'unMute' }), '*');

                        testAudioTimer = setTimeout(() => {
                            stopTestAudio();
                        }, duration * 1000);
                    }
                }, 1000);
            }
        }

        function stopTestAudio() {
            clearTimeout(testAudioTimer);
            clearTimeout(testDelayPlayTimer);
            clearInterval(testCountInterval);

            const iframe = document.getElementById('testYtPlayer');
            const playBtn = document.getElementById('testPlayAudioBtn');
            const lpRecord = document.getElementById('testLpRecord');
            const testCountdownDisplay = document.getElementById('testCountdownDisplay');

            if (testCountdownDisplay) {
                testCountdownDisplay.classList.add('hidden');
            }

            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'pauseVideo' }), '*');
            }

            if (playBtn) {
                playBtn.className = 'px-6 py-2.5 btn-active-play font-bold text-sm md:text-base rounded-xl shadow-md transition';
                playBtn.disabled = false;
            }
            if (lpRecord) {
                lpRecord.classList.add('paused-spin');
            }
        }

        // 화면 전환 이벤트 처리
        document.getElementById('openTestBtn').addEventListener('click', () => {
            stopAudio();
            rouletteScreen.classList.add('hidden');
            quizScreen.classList.add('hidden');
            quizScreen.classList.remove('flex');
            
            testScreen.classList.remove('hidden');
            testScreen.classList.add('flex');

            initTestPage();
        });

        document.getElementById('goToMainBtn').addEventListener('click', () => {
            stopTestAudio();
            testScreen.classList.add('hidden');
            testScreen.classList.remove('flex');

            rouletteScreen.classList.remove('hidden');
        });

        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');
        const spinWheelBtn = document.getElementById('spinWheelBtn');
        const popupRouletteResult = document.getElementById('popupRouletteResult');

        let currentAngle = 0;
        let isWheelSpinning = false;

        function drawRoulette() {
            const numSlices = wheelItems.length;
            const sliceAngle = (2 * Math.PI) / numSlices;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 5;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            wheelItems.forEach((item, i) => {
                const startAngle = currentAngle + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = item.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#1e293b';
                ctx.font = 'bold 15px Noto Sans KR';
                ctx.fillText(item.label, radius - 20, 5);
                ctx.restore();
            });
        }

        drawRoulette();

        document.getElementById('btnO').addEventListener('click', () => {
            stopAudio();
            popupO.classList.remove('hidden');
            popupO.classList.add('flex');
            popupRouletteResult.innerText = '';
            spinWheelBtn.disabled = false;
            spinWheelBtn.innerText = "START ROULETTE!";
            currentAngle = 0;
            drawRoulette();
        });

        spinWheelBtn.addEventListener('click', () => {
            if (isWheelSpinning) return;
            isWheelSpinning = true;
            spinWheelBtn.disabled = true;
            popupRouletteResult.innerText = '돌아가는 중...';

            const totalWeight = wheelItems.reduce((acc, item) => acc + item.weight, 0);
            let random = Math.random() * totalWeight;
            let winIndex = 0;
            for (let i = 0; i < wheelItems.length; i++) {
                if (random < wheelItems[i].weight) {
                    winIndex = i;
                    break;
                }
                random -= wheelItems[i].weight;
            }

            const numSlices = wheelItems.length;
            const sliceAngle = (2 * Math.PI) / numSlices;
            const targetSliceAngle = winIndex * sliceAngle + sliceAngle / 2;
            const targetAngle = (1.5 * Math.PI) - targetSliceAngle;
            
            const extraRotations = 10 * 2 * Math.PI;
            const finalAngle = currentAngle + extraRotations + (targetAngle - (currentAngle % (2 * Math.PI)));

            const startAngle = currentAngle;
            const duration = 4000;
            const startTime = performance.now();

            function animateWheel(currentTime) {
                const elapsed = currentTime - startTime;
                if (elapsed < duration) {
                    const progress = elapsed / duration;
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    currentAngle = startAngle + (finalAngle - startAngle) * easeOut;
                    drawRoulette();
                    requestAnimationFrame(animateWheel);
                } else {
                    currentAngle = finalAngle;
                    drawRoulette();
                    isWheelSpinning = false;
                    popupRouletteResult.innerText = `🎉 [${wheelItems[winIndex].label}] 당첨! 🎉`;
                }
            }

            requestAnimationFrame(animateWheel);
        });

        document.getElementById('btnX').addEventListener('click', () => {
            stopAudio();
            popupX.classList.remove('hidden');
            popupX.classList.add('flex');
        });

        function resetSlot(slotId, defaultText) {
            const wrapper = document.getElementById(slotId);
            wrapper.style.transition = 'none';
            wrapper.style.transform = 'translateY(0)';
            wrapper.innerHTML = `<div class="slot-item">${defaultText}</div>`;
        }

        document.querySelectorAll('.close-popup').forEach(button => {
            button.addEventListener('click', () => {
                popupO.classList.add('hidden');
                popupO.classList.remove('flex');
                popupX.classList.add('hidden');
                popupX.classList.remove('flex');

                stopAudio();
                quizQuestionBox.innerHTML = '';

                quizScreen.classList.add('hidden');
                quizScreen.classList.remove('flex');
                rouletteScreen.classList.remove('hidden');

                isSpun = false;
                selectedResult = { year: '', genre: '', quiz: '' };
                spinBtn.innerText = "SPIN!";
                spinBtn.disabled = false;
                resultBox.classList.remove('opacity-100');
                resultBox.classList.add('opacity-0');
                
                resetSlot('slot1', '년도');
                resetSlot('slot2', '장르');
                resetSlot('slot3', '퀴즈 종류');

                currentAngle = 0;
                isWheelSpinning = false;
                popupRouletteResult.innerText = '';
                spinWheelBtn.innerText = "START ROULETTE!";
                spinWheelBtn.disabled = false;
                drawRoulette();
            });
        });
    </script>
</body>
</html>
