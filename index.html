<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소리새 노래맞추기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #1a1a2e;
            color: white;
            overflow-x: hidden;
        }

        .title-font {
            font-family: 'Black Han Sans', sans-serif;
        }

        .slot-machine-container {
            background: linear-gradient(145deg, #2a2a4a, #151525);
            border: 8px solid #ffd700;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(0,0,0,0.8);
            padding: 20px;
        }

        .slot-window {
            height: 120px;
            overflow: hidden;
            background-color: #ffffff;
            border-radius: 10px;
            border: 4px solid #333;
            box-shadow: inset 0px 10px 15px rgba(0,0,0,0.2), inset 0px -10px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .slot-window::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 10;
        }

        .slot-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .slot-item {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            color: #222;
            text-align: center;
            word-break: keep-all;
            padding: 0 10px;
        }

        @media (max-width: 640px) {
            .slot-window { height: 90px; }
            .slot-item { height: 90px; font-size: 1.1rem; }
            .slot-machine-container { border-width: 4px; padding: 10px; }
        }

        .spin-btn {
            background: linear-gradient(to bottom, #ff416c, #ff4b2b);
            box-shadow: 0 6px 0 #c2293e, 0 10px 20px rgba(0,0,0,0.5);
            transition: all 0.1s;
        }
        .spin-btn:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 0 0 #c2293e, 0 5px 10px rgba(0,0,0,0.5);
        }
        .spin-btn:disabled {
            background: #555;
            box-shadow: 0 6px 0 #333;
            cursor: not-allowed;
            color: #aaa;
        }

        /* LP판 회전 애니메이션 효과 */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin 3s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 1. 룰렛 메인 화면 영역 -->
    <div id="rouletteScreen" class="w-full flex flex-col items-center justify-center">
        <div class="text-center mb-8">
            <h1 class="title-font text-5xl md:text-7xl text-yellow-400 drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] mb-2">SORISAE MUSIC QUIZ</h1>
            <p class="text-gray-300 font-bold text-lg md:text-xl">노래를 맞춰보세요!</p>
        </div>

        <div class="slot-machine-container w-full max-w-4xl mx-auto flex flex-col md:flex-row gap-4 mb-10">
            <div class="flex-1">
                <div class="text-center text-yellow-300 font-bold mb-2 tracking-widest text-sm">YEAR</div>
                <div class="slot-window">
                    <div class="slot-wrapper" id="slot1">
                        <div class="slot-item">년도</div>
                    </div>
                </div>
            </div>

            <div class="flex-1">
                <div class="text-center text-yellow-300 font-bold mb-2 tracking-widest text-sm">GENRE</div>
                <div class="slot-window">
                    <div class="slot-wrapper" id="slot2">
                        <div class="slot-item">장르</div>
                    </div>
                </div>
            </div>

            <div class="flex-1">
                <div class="text-center text-yellow-300 font-bold mb-2 tracking-widest text-sm">QUIZ</div>
                <div class="slot-window">
                    <div class="slot-wrapper" id="slot3">
                        <div class="slot-item">퀴즈 종류</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-center w-full max-w-4xl">
            <button id="spinBtn" class="spin-btn title-font text-3xl md:text-4xl w-full max-w-md py-4 rounded-full text-white mb-8 border-4 border-white/20 uppercase tracking-wider">
                SPIN!
            </button>

            <div id="resultBox" class="w-full bg-black/50 border-2 border-yellow-500/50 rounded-xl p-6 text-center opacity-0 transition-opacity duration-500">
                <h2 class="text-yellow-400 font-bold mb-2 text-sm md:text-base">🎉 당첨 결과 🎉</h2>
                <div id="resultText" class="text-2xl md:text-3xl font-black text-white leading-relaxed word-break-keep">
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 문제 풀기 화면 영역 -->
    <div id="quizScreen" class="w-full max-w-2xl hidden flex-col items-center justify-center">
        <div class="text-center mb-6">
            <h2 class="title-font text-4xl text-yellow-400 drop-shadow-md">QUIZ TIME</h2>
        </div>

        <div id="quizQuestionBox" class="w-full bg-white rounded-2xl min-h-80 shadow-2xl flex flex-col items-center justify-center p-6 text-black text-xl md:text-2xl font-bold mb-8 text-center leading-relaxed overflow-hidden">
            여기에 문제가 출제됩니다.
        </div>

        <div class="flex gap-8 w-full justify-center">
            <button id="btnO" class="w-32 h-32 md:w-40 md:h-40 bg-green-500 hover:bg-green-600 active:scale-95 text-white font-black text-6xl md:text-7xl rounded-3xl shadow-lg border-4 border-white transition">
                O
            </button>
            <button id="btnX" class="w-32 h-32 md:w-40 md:h-40 bg-red-500 hover:bg-red-600 active:scale-95 text-white font-black text-6xl md:text-7xl rounded-3xl shadow-lg border-4 border-white transition">
                X
            </button>
        </div>
    </div>

    <!-- 3. 팝업창 영역 -->
    <div id="popupO" class="fixed inset-0 bg-black/85 hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border-4 border-yellow-400 rounded-2xl p-6 w-full max-w-sm md:max-w-md relative flex flex-col items-center shadow-2xl">
            <button class="close-popup absolute top-3 right-4 text-gray-400 hover:text-white text-3xl font-bold">✕</button>
            <h3 class="title-font text-2xl md:text-3xl text-yellow-400 mb-4">🎁 정답 룰렛</h3>
            <div class="relative flex flex-col items-center justify-center my-2">
                <div class="w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[20px] border-t-red-500 absolute -top-3 z-20 drop-shadow"></div>
                <canvas id="rouletteCanvas" width="280" height="280" class="rounded-full shadow-2xl border-4 border-yellow-300"></canvas>
            </div>
            <div id="popupRouletteResult" class="text-xl font-bold text-yellow-300 mt-2 h-8 text-center"></div>
            <button id="spinWheelBtn" class="spin-btn title-font text-xl w-full py-3 rounded-full text-white mt-2 border-2 border-white/20">
                START ROULETTE!
            </button>
        </div>
    </div>

    <div id="popupX" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border-4 border-red-500 rounded-2xl p-6 md:p-8 w-full max-w-md relative flex flex-col items-center shadow-2xl">
            <button class="close-popup absolute top-4 right-4 text-gray-400 hover:text-white text-3xl font-bold px-2">✕</button>
            <div class="text-center py-8">
                <div class="text-4xl md:text-5xl font-black text-red-400 mb-2">다음기회에 ㅠㅠ</div>
            </div>
        </div>
    </div>

    <script>
        const col1Data = [
            { text: '00~05', weight: 10 },
            { text: '05~10', weight: 10 },
            { text: '10~15', weight: 10 },
            { text: '15~20', weight: 35 },
            { text: '20~26', weight: 35 }
        ];

        const col2Data = [
            { text: 'POP', weight: 1 },
            { text: 'KPOP', weight: 1 },
            { text: 'JPOP', weight: 1 },
            { text: '발라드', weight: 1 },
            { text: '밴드', weight: 1 },
            { text: '힙합', weight: 1 }
        ];

        const col3Data = [
            { text: '1초 듣기', weight: 1 },
            { text: '가사 보기', weight: 1 },
            { text: 'MR 5초 듣기', weight: 1 }
        ];

        const wheelItems = [
            { label: '마이쮸', weight: 47, color: '#f87171' },
            { label: '초콜렛', weight: 47, color: '#fbbf24' },
            { label: 'ing쿠폰 5천원', weight: 5, color: '#60a5fa' },
            { label: '배민 1만원', weight: 1, color: '#34d399' }
        ];

        const sampleVideoUrl = 'https://www.youtube.com/watch?v=M7lc1UVf-VE';

        const quizDatabase = {};

        col1Data.forEach(y => {
            col2Data.forEach(g => {
                col3Data.forEach(q => {
                    const key = `${y.text}_${g.text}_${q.text}`;

                    if (q.text === '1초 듣기') {
                        quizDatabase[key] = [
                            { type: 'video', src: sampleVideoUrl, title: `🎵 [${y.text}] ${g.text} 1초 음원을 듣고 맞춰보세요!` }
                        ];
                    } else if (q.text === 'MR 5초 듣기') {
                        quizDatabase[key] = [
                            { type: 'video', src: sampleVideoUrl, title: `🎼 [${y.text}] ${g.text} MR 5초 음원을 듣고 맞춰보세요!` }
                        ];
                    } else {
                        quizDatabase[key] = [
                            { type: 'text', title: `Q. [${y.text}] ${g.text} 대표곡의 빈칸 가사를 맞혀보세요!` }
                        ];
                    }
                });
            });
        });

        function getYoutubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url;
        }

        let isSpun = false;
        let selectedResult = { year: '', genre: '', quiz: '' };

        function getRandomItemByWeight(items) {
            const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
            let random = Math.random() * totalWeight;
            
            for (const item of items) {
                if (random < item.weight) return item.text;
                random -= item.weight;
            }
            return items[items.length - 1].text;
        }

        function getRandomText(items) {
            const idx = Math.floor(Math.random() * items.length);
            return items[idx].text;
        }

        const spinBtn = document.getElementById('spinBtn');
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');
        const rouletteScreen = document.getElementById('rouletteScreen');
        const quizScreen = document.getElementById('quizScreen');
        const quizQuestionBox = document.getElementById('quizQuestionBox');
        const popupO = document.getElementById('popupO');
        const popupX = document.getElementById('popupX');

        async function spinSlot(slotId, dataArr, winnerText, duration, extraSpins) {
            return new Promise((resolve) => {
                const wrapper = document.getElementById(slotId);
                wrapper.innerHTML = '';
                wrapper.style.transition = 'none';
                wrapper.style.transform = 'translateY(0)';

                const itemHeight = window.innerWidth <= 640 ? 90 : 120;
                const totalItems = extraSpins + 1;

                let htmlStr = `<div class="slot-item">${getRandomText(dataArr)}</div>`;
                for(let i = 0; i < extraSpins - 1; i++) {
                    htmlStr += `<div class="slot-item">${getRandomText(dataArr)}</div>`;
                }
                htmlStr += `<div class="slot-item text-red-600">${winnerText}</div>`;
                
                wrapper.innerHTML = htmlStr;
                wrapper.offsetHeight; 

                wrapper.style.transition = `transform ${duration}ms cubic-bezier(0.2, 0.8, 0.1, 1)`;
                wrapper.style.transform = `translateY(-${(totalItems - 1) * itemHeight}px)`;

                setTimeout(() => { resolve(winnerText); }, duration);
            });
        }

        spinBtn.addEventListener('click', async () => {
            if (isSpun) {
                const quizKey = `${selectedResult.year}_${selectedResult.genre}_${selectedResult.quiz}`;
                const questionList = quizDatabase[quizKey];
                
                quizQuestionBox.innerHTML = '';

                if (questionList && questionList.length > 0) {
                    const quiz = questionList[Math.floor(Math.random() * questionList.length)];

                    // 오디오 전용 플레이어 구성 (유튜브 비디오는 너비/높이 0px로 숨김)
                    if (quiz.type === 'video') {
                        const videoId = getYoutubeId(quiz.src);
                        quizQuestionBox.innerHTML = `
                            <div class="text-xl md:text-2xl font-bold mb-4 text-slate-800">${quiz.title}</div>
                            
                            <!-- LP판 회전 아이콘 디자인 -->
                            <div class="relative w-28 h-28 my-2 flex items-center justify-center">
                                <div class="w-28 h-28 rounded-full bg-slate-900 border-4 border-gray-700 flex items-center justify-center shadow-lg animate-spin-slow">
                                    <div class="w-10 h-10 rounded-full bg-red-500 border-2 border-white"></div>
                                </div>
                            </div>

                            <!-- 숨겨진 유튜브 오디오 플레이어 iframe -->
                            <iframe id="ytPlayer" class="w-0 h-0 opacity-0 absolute pointer-events-none" 
                                src="https://www.youtube-nocookie.com/embed/${videoId}?enablejsapi=1&autoplay=1" 
                                allow="autoplay">
                            </iframe>

                            <!-- 재생 / 일시정지 제어 버튼 -->
                            <div class="flex gap-4 mt-4">
                                <button onclick="toggleAudio(true)" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-lg shadow transition">
                                    ▶ 음원 재생
                                </button>
                                <button onclick="toggleAudio(false)" class="px-5 py-2 bg-gray-600 hover:bg-gray-700 text-white font-bold text-sm rounded-lg shadow transition">
                                    ⏸ 정지
                                </button>
                            </div>
                        `;
                    } else {
                        quizQuestionBox.innerText = quiz.title || quiz;
                    }
                } else {
                    quizQuestionBox.innerText = `아직 [${quizKey}] 조건의 문제가 등록되지 않았습니다.`;
                }

                rouletteScreen.classList.add('hidden');
                quizScreen.classList.remove('hidden');
                quizScreen.classList.add('flex');
                return;
            }

            spinBtn.disabled = true;
            spinBtn.innerText = "SPINNING...";
            resultBox.classList.remove('opacity-100');
            resultBox.classList.add('opacity-0');

            const result1 = getRandomItemByWeight(col1Data);
            const result2 = getRandomItemByWeight(col2Data);
            const result3 = getRandomItemByWeight(col3Data);

            selectedResult = { year: result1, genre: result2, quiz: result3 };

            const p1 = spinSlot('slot1', col1Data, result1, 2500, 30);
            const p2 = spinSlot('slot2', col2Data, result2, 3500, 45);
            const p3 = spinSlot('slot3', col3Data, result3, 4500, 60);

            await Promise.all([p1, p2, p3]);

            resultText.innerHTML = `<span class="text-yellow-400">[${result1}]</span> 년도 
                                    <span class="text-pink-400">[${result2}]</span> 장르 
                                    <span class="text-green-400">[${result3}]</span> !`;
            
            resultBox.classList.remove('opacity-0');
            resultBox.classList.add('opacity-100');
            
            spinBtn.innerText = "LET YOUR SOUND FLY!";
            spinBtn.disabled = false;
            isSpun = true;
        });

        // 음원 재생/정지 제어 함수 (postMessage 제어)
        function toggleAudio(play) {
            const iframe = document.getElementById('ytPlayer');
            if (iframe) {
                const command = play ? 'playVideo' : 'pauseVideo';
                iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: command }), '*');
            }
        }

        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');
        const spinWheelBtn = document.getElementById('spinWheelBtn');
        const popupRouletteResult = document.getElementById('popupRouletteResult');

        let currentAngle = 0;
        let isWheelSpinning = false;

        function drawRoulette() {
            const numSlices = wheelItems.length;
            const sliceAngle = (2 * Math.PI) / numSlices;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 5;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            wheelItems.forEach((item, i) => {
                const startAngle = currentAngle + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = item.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#1e293b';
                ctx.font = 'bold 15px Noto Sans KR';
                ctx.fillText(item.label, radius - 20, 5);
                ctx.restore();
            });
        }

        drawRoulette();

        document.getElementById('btnO').addEventListener('click', () => {
            toggleAudio(false); // 팝업 열릴 때 음원 일시정지
            popupO.classList.remove('hidden');
            popupO.classList.add('flex');
            popupRouletteResult.innerText = '';
            spinWheelBtn.disabled = false;
            spinWheelBtn.innerText = "START ROULETTE!";
            currentAngle = 0;
            drawRoulette();
        });

        spinWheelBtn.addEventListener('click', () => {
            if (isWheelSpinning) return;
            isWheelSpinning = true;
            spinWheelBtn.disabled = true;
            popupRouletteResult.innerText = '돌아가는 중...';

            const totalWeight = wheelItems.reduce((acc, item) => acc + item.weight, 0);
            let random = Math.random() * totalWeight;
            let winIndex = 0;
            for (let i = 0; i < wheelItems.length; i++) {
                if (random < wheelItems[i].weight) {
                    winIndex = i;
                    break;
                }
                random -= wheelItems[i].weight;
            }

            const numSlices = wheelItems.length;
            const sliceAngle = (2 * Math.PI) / numSlices;
            const targetSliceAngle = winIndex * sliceAngle + sliceAngle / 2;
            const targetAngle = (1.5 * Math.PI) - targetSliceAngle;
            
            const extraRotations = 10 * 2 * Math.PI;
            const finalAngle = currentAngle + extraRotations + (targetAngle - (currentAngle % (2 * Math.PI)));

            const startAngle = currentAngle;
            const duration = 4000;
            const startTime = performance.now();

            function animateWheel(currentTime) {
                const elapsed = currentTime - startTime;
                if (elapsed < duration) {
                    const progress = elapsed / duration;
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    currentAngle = startAngle + (finalAngle - startAngle) * easeOut;
                    drawRoulette();
                    requestAnimationFrame(animateWheel);
                } else {
                    currentAngle = finalAngle;
                    drawRoulette();
                    isWheelSpinning = false;
                    popupRouletteResult.innerText = `🎉 [${wheelItems[winIndex].label}] 당첨! 🎉`;
                }
            }

            requestAnimationFrame(animateWheel);
        });

        document.getElementById('btnX').addEventListener('click', () => {
            toggleAudio(false); // 팝업 열릴 때 음원 일시정지
            popupX.classList.remove('hidden');
            popupX.classList.add('flex');
        });

        function resetSlot(slotId, defaultText) {
            const wrapper = document.getElementById(slotId);
            wrapper.style.transition = 'none';
            wrapper.style.transform = 'translateY(0)';
            wrapper.innerHTML = `<div class="slot-item">${defaultText}</div>`;
        }

        document.querySelectorAll('.close-popup').forEach(button => {
            button.addEventListener('click', () => {
                popupO.classList.add('hidden');
                popupO.classList.remove('flex');
                popupX.classList.add('hidden');
                popupX.classList.remove('flex');

                quizQuestionBox.innerHTML = '';

                quizScreen.classList.add('hidden');
                quizScreen.classList.remove('flex');
                rouletteScreen.classList.remove('hidden');

                isSpun = false;
                selectedResult = { year: '', genre: '', quiz: '' };
                spinBtn.innerText = "SPIN!";
                spinBtn.disabled = false;
                resultBox.classList.remove('opacity-100');
                resultBox.classList.add('opacity-0');
                
                resetSlot('slot1', '년도');
                resetSlot('slot2', '장르');
                resetSlot('slot3', '퀴즈 종류');

                currentAngle = 0;
                isWheelSpinning = false;
                popupRouletteResult.innerText = '';
                spinWheelBtn.innerText = "START ROULETTE!";
                spinWheelBtn.disabled = false;
                drawRoulette();
            });
        });
    </script>
</body>
</html>
